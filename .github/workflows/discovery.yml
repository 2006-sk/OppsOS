name: Discovery

# Runs on a GitHub-hosted runner. This works because the database lives on
# Turso (network-reachable libSQL) rather than a local file — both this
# workflow and the deployed web app read/write the same live data. See
# README.md for the migration notes (this used to require a self-hosted
# runner pointed at a local SQLite file; that's no longer the case).

on:
  schedule:
    # 3x/week — Mon/Wed/Fri at 06:00 UTC. Adjust to taste; the pipeline
    # rotates through queries itself, so more frequent runs just mean faster
    # rotation, not duplicate work.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      query_count:
        description: "Number of discovery queries to run (use a small number for a quick verification run)"
        required: false
        default: "5"
      winner_mining_count:
        description: "Number of winner-mining queries to run"
        required: false
        default: "1"

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run discovery
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_COMPAT_API_KEY: ${{ secrets.LLM_COMPAT_API_KEY }}
          LLM_COMPAT_BASE_URL: ${{ vars.LLM_COMPAT_BASE_URL }}
          LLM_COMPAT_MODEL: ${{ vars.LLM_COMPAT_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DISCOVERY_QUERY_COUNT: ${{ inputs.query_count || '5' }}
          DISCOVERY_WINNER_MINING_COUNT: ${{ inputs.winner_mining_count || '1' }}
        run: python -m app.discovery.run
