name: Discovery

# IMPORTANT — read before enabling this on GitHub-hosted runners:
# This service reads/writes the shared SQLite file at data/app.db. That file
# is NOT checked into git (it's a runtime artifact with real user data) and
# GitHub-hosted runners are ephemeral with no shared disk — so a run here
# only sees a fresh, empty DB unless it's running on a machine that actually
# has the persistent data/app.db file, i.e. a self-hosted runner on the same
# host/volume as your deployment. See README.md "Known limitations" for the
# tradeoffs and the recommended path (a network-reachable DB such as Turso/
# libSQL or Postgres/Supabase) if you deploy the web app to Vercel and want
# GitHub-hosted runners to update the same data the live site reads.

on:
  schedule:
    # 3x/week — Mon/Wed/Fri at 06:00 UTC. Adjust to taste; the pipeline
    # rotates through queries itself, so more frequent runs just mean faster
    # rotation, not duplicate work.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  discovery:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run discovery
        env:
          DATABASE_PATH: ${{ vars.DATABASE_PATH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_COMPAT_API_KEY: ${{ secrets.LLM_COMPAT_API_KEY }}
          LLM_COMPAT_BASE_URL: ${{ vars.LLM_COMPAT_BASE_URL }}
          LLM_COMPAT_MODEL: ${{ vars.LLM_COMPAT_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m app.discovery.run
